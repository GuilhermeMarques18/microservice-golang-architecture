apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-processor
  labels:
    app.kubernetes.io/name: compute-processor
    app.kubernetes.io/component: processor
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: compute-processor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compute-processor
        app.kubernetes.io/component: processor
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: compute-processor
          image: compute-processor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: compute-processor
  labels:
    app.kubernetes.io/name: compute-processor
    app.kubernetes.io/component: processor
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: compute-processor
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compute-processor
  labels:
    app.kubernetes.io/name: compute-processor
    app.kubernetes.io/component: processor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compute-processor
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 200
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
